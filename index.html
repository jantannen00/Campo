<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torre de Control Agrícola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra de módulos en verde campo + espacio de trabajo con tablas operables y ficha lateral */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --sunk:#E9EFE8; --fg:#18281D; --muted:#5A6B5F; --line:#DCE4DA; --line-strong:#C3D0C2;
  --brand:#16351F; --brand-fg:#E6F0E8; --brand-muted:#93B59D; --brand-soft:#24603A;
  --accent:#2E7346; --accent-fg:#FFFFFF; --accent-soft:#E1EEE3;
  --ok:#2C6B42; --ok-bg:#E1EEE3; --warn:#8F5A0E; --warn-bg:#FAEFD7; --bad:#A3372A; --bad-bg:#F8E3DF; --neu:#56645A; --neu-bg:#E8ECE7;
  --shade:rgba(16,28,20,.38);
  /* Salas (validado: CVD y visión normal en pares vecinos, claro y oscuro) */
  --s1:#1E8A4C; --s2:#C99A1E; --s3:#C8366B; --s4:#2F6DB5; --s5:#E07B2E; --grid:#E4EAE3;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#15201A; --sunk:#1B2820; --fg:#E2EBE4; --muted:#98AC9D; --line:#29392E; --line-strong:#38503F;
  --brand:#0A160E; --brand-fg:#D8E8DC; --brand-muted:#7FA28A; --brand-soft:#1F4A2D;
  --accent:#62B47F; --accent-fg:#0A160E; --accent-soft:#1D3A26;
  --ok:#7DC797; --ok-bg:#1D3A26; --warn:#E5B567; --warn-bg:#3A2D14; --bad:#EF8F80; --bad-bg:#3E1F1A; --neu:#A9B8AD; --neu-bg:#222F27;
  --shade:rgba(0,0,0,.55);
  --s1:#23874B; --s2:#BC891C; --s3:#E0558A; --s4:#5A92D8; --s5:#D9742B; --grid:#22302A;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#15201A; --sunk:#1B2820; --fg:#E2EBE4; --muted:#98AC9D; --line:#29392E; --line-strong:#38503F;
  --brand:#0A160E; --brand-fg:#D8E8DC; --brand-muted:#7FA28A; --brand-soft:#1F4A2D;
  --accent:#62B47F; --accent-fg:#0A160E; --accent-soft:#1D3A26;
  --ok:#7DC797; --ok-bg:#1D3A26; --warn:#E5B567; --warn-bg:#3A2D14; --bad:#EF8F80; --bad-bg:#3E1F1A; --neu:#A9B8AD; --neu-bg:#222F27;
  --shade:rgba(0,0,0,.55);
  --s1:#23874B; --s2:#BC891C; --s3:#E0558A; --s4:#5A92D8; --s5:#D9742B; --grid:#22302A;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);margin:0}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side{background:var(--brand);color:var(--brand-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px)}
.logo{display:flex;align-items:center;gap:10px;padding:22px 20px 6px;font-weight:600;font-size:20px;letter-spacing:-.01em}
.logo svg{flex:none}
.lname{font-size:16.5px;line-height:1.2;text-wrap:balance;min-width:0}
.tag{padding:0 20px 18px;font-size:11.5px;color:var(--brand-muted);border-bottom:1px solid rgba(255,255,255,.08)}
.nav{display:flex;flex-direction:column;gap:2px;padding:12px 10px}
.navgrp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-muted);padding:12px 12px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:7px;color:var(--brand-fg);opacity:.78;font-size:14px}
.nav button:hover{opacity:1;background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{opacity:1;background:var(--brand-soft);font-weight:500}
.nav button:focus-visible{outline:2px solid var(--brand-muted);outline-offset:1px}
.soon{font-size:10.5px;color:var(--brand-muted)}
.sidefoot{margin-top:auto;padding:14px 20px;font-size:11px;color:var(--brand-muted);border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:4px;min-width:0}
.sidefoot .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:2px;align-self:flex-start}
.linkbtn:focus-visible{outline:2px solid var(--brand-muted);outline-offset:2px}
main{min-width:0;padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-bg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn:focus-visible,.chip:focus-visible,tr[data-open]:focus-visible,tr[data-op]:focus-visible,tr[data-rec]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.summary.s4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-weight:500;font-size:24px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:4px}
.stat span{font-size:12px;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.count{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{all:unset;cursor:pointer;padding:5px 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.field{padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:13px;min-width:0}
.search{flex:1 1 200px;max-width:280px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
th.num{text-align:right}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr[data-open],tr[data-op],tr[data-rec]{cursor:pointer}
tr[data-open]:hover td,tr[data-op]:hover td,tr[data-rec]:hover td{background:var(--sunk)}
tfoot td{font-weight:500;background:var(--sunk)}
.id{font-family:var(--mono);font-weight:500;font-size:12.5px;white-space:nowrap}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-neu{background:var(--neu-bg);color:var(--neu)}
.gap{color:var(--warn);font-size:12px;white-space:nowrap}
.bad{color:var(--bad)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.banner{padding:10px 14px;border-radius:9px;margin-bottom:14px;font-size:13px;background:var(--warn-bg);color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner ul{margin:4px 0 0;padding-left:18px}
.banner.err{background:var(--bad-bg);color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.ph{max-width:520px;margin:12vh auto 0;text-align:center}
.ph h2{font-size:20px;font-weight:600;margin:0 0 6px}
.ph p{color:var(--muted);margin:0}
/* paneles y gráficos */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;margin-bottom:16px}
.two .panel{margin-bottom:0}
.panel h3{margin:0 0 10px;font-size:14px;font-weight:600}
.period{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.periodinfo{font-size:12px;color:var(--muted);margin-top:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block;flex:none}
.sq{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.chartwrap{position:relative;min-height:280px}
.chartwrap svg{display:block}
.chartwrap text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);min-width:170px;z-index:2}
.tip b{display:block;margin-bottom:4px;font-weight:600}
.tip div{display:flex;align-items:center;gap:6px}
.tip .v{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-left:12px}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:104px minmax(0,1fr) 70px;align-items:center;gap:8px;font-size:12.5px}
.hb.dim{opacity:.35}
.hb-l{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-b{display:block;height:14px;border-radius:0 4px 4px 0;min-width:2px}
.hb-v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
/* inicio de sesión */
.login{min-height:100vh;display:grid;place-items:center;background:var(--brand);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lcard{width:min(380px,100%);background:var(--surface);border-radius:14px;padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.lcard .logo{padding:0;color:var(--fg)}
.lcard h1{font-size:20px}
.lcard .btn{width:100%;padding:9px 13px}
.lnote{font-size:12px;color:var(--muted);margin:0}
/* ficha */
.shade{position:fixed;inset:0;background:var(--shade);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.dhead h2{margin:0;font-size:17px;font-weight:600}
.eqthumb{width:52px;height:40px;object-fit:cover;border-radius:6px;background:var(--sunk);display:block}
.eqfoto{display:flex;flex-direction:column;gap:8px}
.eqfoto img{width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:var(--sunk);display:block}
.dbody{overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:20px}
.dfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface)}
fieldset{border:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
legend{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px;padding:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f.wide{grid-column:1/-1}
label.f .field{color:var(--fg);font-size:13.5px;width:100%}
textarea.field{min-height:72px;resize:vertical;font:inherit;font-size:13.5px}
.drop{grid-column:1/-1;border:1.5px dashed var(--line-strong);border-radius:10px;padding:14px;background:var(--sunk);display:flex;flex-direction:column;gap:6px;font-size:13px}
.ok{color:var(--ok)}
.navalerta{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--bad-bg);color:var(--bad);white-space:nowrap}
.niveles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin-bottom:16px}
.niveles .panel{margin-bottom:0}
.nivel{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.nivel svg{flex:none;max-width:100%}
.nivel text{fill:var(--muted);font-size:11px;font-family:var(--mono)}
.nivelinfo{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:6px}
.nivelinfo h3{margin:0}
.nivelnum{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.nivelform{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}
.nivelform .f{flex:1 1 110px}
.need .field{border-color:var(--warn)}
.calc{grid-column:1/-1;background:var(--sunk);border-radius:9px;padding:10px 12px;font-size:13px;display:flex;gap:18px;flex-wrap:wrap}
.calc b{font-family:var(--mono);font-weight:500}
.docrow{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.1fr);gap:8px;align-items:end}
.grid3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.err{color:var(--bad);font-size:12.5px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.opform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end;padding:14px;border-bottom:1px solid var(--line);background:var(--sunk)}
@media (max-width:900px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding-right:env(safe-area-inset-right,0px)}
  .tag,.navgrp{display:none}
  .sidefoot{flex-direction:row;justify-content:space-between;align-items:center;padding:8px max(16px,env(safe-area-inset-left,0px));border-top:none}
  .logo{padding:14px max(16px,env(safe-area-inset-left,0px)) 4px}
  .nav{flex-direction:row;overflow-x:auto;padding:6px 10px 10px}
  .nav button{white-space:nowrap}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
  .summary,.summary.s4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .summary>.stat:last-child:nth-child(odd){grid-column:1/-1}
  .two{grid-template-columns:1fr}
  fieldset{grid-template-columns:1fr}
  .docrow{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .opform{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form class="lcard" id="loginform" novalidate>
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#2E7346"/><path d="M5 18h16M5 13.5h16M8 9h10" stroke="#E6F0E8" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="lname">Torre de Control Agrícola</span>
    </div>
    <div><h1>Entrar</h1><div class="sub">Usa el correo y la contraseña que te entregó el administrador.</div></div>
    <label class="f">Correo<input class="field" id="l-email" type="email" autocomplete="username" required></label>
    <label class="f">Contraseña<input class="field" id="l-pass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="l-err" role="alert" hidden></div>
    <button class="btn primary" type="submit" id="l-btn">Entrar</button>
    <p class="lnote">¿No tienes cuenta? Pídele al administrador que te cree un usuario.</p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#2E7346"/><path d="M5 18h16M5 13.5h16M8 9h10" stroke="#E6F0E8" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="lname">Torre de Control Agrícola</span>
    </div>
    <div class="tag">Operaciones agrícolas</div>
    <nav class="nav" id="nav" aria-label="Módulos"></nav>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="layer"></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="xls" accept=".xlsx,.xls" hidden>
<input type="file" id="imgs" accept="image/jpeg,image/png,image/webp" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* Conexión. La clave publicable puede ir en el navegador: lo que cada usuario puede leer o escribir lo deciden las reglas RLS. */
const SUPABASE_URL='https://ryelugkgjcxxxebinctw.supabase.co';
const SUPABASE_KEY='sb_publishable_578gWB25lHAmmaOl9kcNpA_ICXwofww';
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

const MODS=[
  {grp:'Lechería'},{id:'leche',label:'Leche'},{id:'rebano',label:'Rebaño'},
  {grp:'Maquinaria'},{id:'maquinaria',label:'Equipos'},{id:'mantenciones',label:'Mantenciones'},{id:'combustible',label:'Combustible'},
  {grp:'Insumos'},{id:'inventario',label:'Inventario'},

function docState(d){
  if(!d) return 'Sin dato';
  const s=d.situacion;
  if(s==='Con fecha'&&d.vencimiento){
    const [y,m]=d.vencimiento.split('-').map(Number);
    const end=new Date(y,m,0,23,59);
    const days=(end-today)/864e5;
    return days<0?'Vencido':days<=60?'Por vencer':'Vigente';
  }
  if(s==='Vencido sin fecha exacta') return 'Vencido';
  if(s==='Vigente sin fecha') return 'Vigente';
  if(s==='No tiene') return 'No tiene';
  return 'Sin dato';
}

  return g;
}

const horoActual=e=>{const p=S.plan.get(e.id_maquina);return p&&p.horometro_actual!=null?+p.horometro_actual:e.horometro_inicial};
function mant(e){
  if(SIN_HORAS.has(e.tipo)) return {txt:'No aplica',cls:'muted',st:'No aplica'};
  if(e.intervalo_mant_horas==null) return {txt:'Sin plan',cls:'muted',st:'Sin plan'};
  const p=S.plan.get(e.id_maquina);
  const prox=p&&p.proxima_mant_horometro!=null?+p.proxima_mant_horometro:(e.horometro_inicial!=null?e.horometro_inicial+e.intervalo_mant_horas:null);
  if(prox==null) return {txt:'Falta horómetro',cls:'gap',st:'Falta horómetro'};
  const rest=p&&p.horas_restantes!=null?+p.horas_restantes:null;
  const km=e.unidad_medidor==='km', u=km?' km':' h', aviso=km?PROXIMA_KM:PROXIMA_H;
  if(rest!=null&&rest<=0) return {txt:'Vencida ('+fmtN(prox)+u+')',cls:'bad',prox,rest,st:'Vencida',u};
  if(rest!=null&&rest<=aviso) return {txt:(km?'a los ':'a las ')+fmtN(prox)+u,cls:'gap',prox,rest,st:'Próxima',u};
  return {txt:(km?'a los ':'a las ')+fmtN(prox)+u,cls:'',prox,rest,st:'Al día',u};
}

/* Última lectura de horómetro conocida para un equipo hasta una fecha (cargas y mantenciones). */
function lastReading(id,fecha,excl){
  let best=null;
  const see=(h,f,src)=>{if(h==null||(fecha&&f>fecha))return;h=+h;if(!best||f>best.f||(f===best.f&&h>best.h))best={h,f,src}};
  for(const r of S.comb) if(r.id_maquina===id&&r.id_carga!==excl) see(r.horometro,r.fecha,'carga '+r.id_carga);
  for(const r of S.mant) if(r.id_maquina===id&&r.id_intervencion!==excl) see(r.horometro,r.fecha,'mantención '+r.id_intervencion);
  const e=S.eq.get(id);
  if(!best&&e&&e.horometro_inicial!=null) best={h:+e.horometro_inicial,f:'',src:'horómetro inicial'};
  return best;
}

/* Supabase entrega como máximo 1.000 filas por consulta: se pide por páginas. */
async function fetchAll(table,select,order){
  const out=[],step=1000;
  for(let from=0;;from+=step){
    let q=sb.from(table).select(select).range(from,from+step-1);
    for(const o of order) q=q.order(o,{ascending:true});
    const {data,error}=await q;
    if(error) throw error;
    out.push(...data);
    if(data.length<step) break;
  }
  return out;
}

/* Imágenes de equipos: un archivo por equipo en el bucket privado "equipos", con el ID como nombre. Si fallan, la aplicación sigue sin ellas. */
const IMG_HORAS=6, IMG_MB=5, IMG_EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
async function cargarImagenes(){
  const {data:list,error}=await sb.storage.from('equipos').list('',{limit:1000});
  if(error) return;
  const paths=list.map(f=>f.name).filter(n=>!n.startsWith('.'));
  const m=new Map();
  if(paths.length){
    const {data,error:e2}=await sb.storage.from('equipos').createSignedUrls(paths,(IMG_HORAS+1)*3600);
    if(e2) return;
    for(const f of data) if(f.signedUrl) m.set(f.path.replace(/\.[^.]+$/,''),{path:f.path,url:f.signedUrl});
  }
  S.imgs=m;S.imgsAt=Date.now();render();
}
/* Con idFijo la imagen va a ese equipo; si no, el nombre del archivo indica el equipo (TR-10.jpg). */
async function subirImagenes(files,idFijo){
  if(S.imgBusy) return;
  const issues=[];let ok=0;
  S.imgBusy=true;render();
  for(const f of files){
    const id=idFijo||f.name.replace(/\.[^.]+$/,'').trim().toUpperCase(), ext=IMG_EXT[f.type];
    if(!S.eq.has(id)){issues.push(`${f.name}: no existe un equipo con el ID ${id}.`);continue}
    if(!ext){issues.push(`${f.name}: usa una imagen JPG, PNG o WEBP.`);continue}
    if(f.size>IMG_MB*1048576){issues.push(`${f.name}: pesa más de ${IMG_MB} MB.`);continue}
    const path=`${id}.${ext}`, antes=S.imgs.get(id)?.path;
    const {error}=await sb.storage.from('equipos').upload(path,f,{upsert:true,contentType:f.type});
    if(error){issues.push(`${f.name}: ${errMsg(error)}`);continue}
    if(antes&&antes!==path) await sb.storage.from('equipos').remove([antes]);
    ok++;
  }
  S.imgBusy=false;S.importIssues=issues;S.importKind='maquinaria';
  await cargarImagenes();
  render();
  toast(`${ok} imagen${ok===1?'':'es'} cargada${ok===1?'':'s'}${issues.length?` · ${issues.length} con problemas`:''}`);
}

async function upsert(table,rows,onConflict){
  for(let i=0;i<rows.length;i+=500){
    const {error}=await sb.from(table).upsert(rows.slice(i,i+500),{onConflict});

function errMsg(e){
  if(!e) return 'No se pudo guardar. Inténtalo de nuevo.';
  if(e.aviso) return e.aviso;
  if(isAuthErr(e)) return 'Tu sesión expiró. Vuelve a iniciar sesión.';
  if(e.code==='42501') return 'No tienes permiso para hacer este cambio.';
  if(e.code==='23505') return 'Ya existe un registro con esa clave.';
  if(e.code==='23503') return /operador/i.test(e.message||'')?'El operador indicado no existe. Agrégalo primero en Equipos › Operadores.':'Falta un dato relacionado: revisa que el equipo, el operador y el centro existan.';

/* Precio vigente: el de la última compra con precio hasta esa fecha (cualquier estanque). */
function precioVigente(fecha){
  let p=null;
  for(const i of S.ing) if(i.tipo==='Compra'&&i.precio_litro!=null&&(!fecha||i.fecha<=fecha)&&(!p||i.fecha>=p.fecha)) p=i;
  return p;
}
/* Movimientos de un estanque con saldo acumulado (entradas antes que salidas el mismo día). */
function movimientos(est){
  const m=[];
  for(const i of S.ing) if(i.id_estanque===est) m.push({fecha:i.fecha,tipo:i.tipo,det:[i.proveedor,i.documento,i.observacion].filter(Boolean).join(' · '),ent:+i.litros,sal:0,kind:'ing',key:i.id_ingreso});
  for(const c of S.comb){
    if(c.id_estanque_destino===est) m.push({fecha:c.fecha,tipo:'Traspaso recibido',det:'desde '+estNombre(c.id_estanque),ent:+c.litros,sal:0,kind:'comb',key:c.id_carga});
    if(c.id_estanque===est) m.push({fecha:c.fecha,tipo:esTraspaso(c)?'Traspaso enviado':'Despacho',det:destinoTxt(c)+(c.id_operador?' · '+opName(c.id_operador):''),ent:0,sal:+c.litros,kind:'comb',key:c.id_carga});
  }
  m.sort((a,b)=>a.fecha.localeCompare(b.fecha)||(b.ent-a.ent)||String(a.key).localeCompare(String(b.key)));
  let s=0;for(const x of m){s+=x.ent-x.sal;x.saldo=s}
  return m;
}
const stockAl=(est,fecha,excl)=>{let s=0;for(const x of movimientos(est)) if((!fecha||x.fecha<=fecha)&&!(excl&&x.kind==='comb'&&x.key===excl)) s+=x.ent-x.sal;return s};

/* Nivel de estanques: el dibujo es un estanque vertical, así la altura del líquido es proporcional a los litros. */
function tanqueSvg(v,u='litros'){
  const cap=+v.capacidad_l||0, st=+v.stock_calculado, al=v.alerta_litros==null?null:+v.alerta_litros;
  const X=30,W=96,T=24,H=168,y=p=>T+H*(1-p), pct=cap?Math.min(1,Math.max(0,st/cap)):0;
  const nivel=al!=null&&st<=al?'--bad':al!=null&&st<=al*1.25?'--warn':'--accent';

/* Lecturas que dan tramos imposibles: retrocede, no avanza, o el rendimiento sale fuera de rango. */
function lecturasARevisar(fe){
  const out=[], porEq=new Map();
  for(const c of S.comb) if(c.id_maquina&&c.horometro!=null&&(fe==='Todos'||c.id_maquina===fe)) (porEq.get(c.id_maquina)||porEq.set(c.id_maquina,[]).get(c.id_maquina)).push(c);
  for(const [id,cs] of porEq){
    const km=unidadDe(id)==='km', u=km?'km':'h';
    cs.sort((a,b)=>a.fecha.localeCompare(b.fecha)||(+a.horometro-+b.horometro)||byId(a.id_carga,b.id_carga));
    for(let i=1;i<cs.length;i++){
      const a=cs[i-1],b=cs[i],dif=+b.horometro-+a.horometro,l=+b.litros;
      let motivo='';
      if(dif<0) motivo='La lectura retrocede';
      else if(dif===0) motivo='Misma lectura que la carga anterior';
      else if(km&&(dif/l<0.5||dif/l>40)) motivo=`Da ${fmt1(dif/l)} km/L`;
      else if(!km&&(l/dif<0.5||l/dif>80)) motivo=`Da ${fmt1(l/dif)} L/h`;
      if(motivo) out.push({c:b,antes:+a.horometro,dif,u,motivo});
    }
  }
  return out.sort((x,y)=>byId(x.c.id_maquina,y.c.id_maquina)||x.c.fecha.localeCompare(y.c.fecha));
}

async function guardarLista(){
  const k=S.cb.lista, Lc=LISTAS[k];
  const nombre=(val('l-nombre')||'').replace(/\s+/g,' ').trim().toUpperCase();
  if(!nombre){S.lErr='Escribe el nombre.';render();return}
  const items=Lc.items(), ed=S.lEdit?items.find(i=>String(i.pk)===String(S.lEdit)):null;
  if(items.some(i=>i.nombre.toUpperCase()===nombre&&(!ed||i.pk!==ed.pk))){S.lErr=`Ya existe “${nombre}”.`;render();return}
  try{
    if(k==='labores'){
      if(ed) await must(sb.from('labores').update({labor:nombre}).eq('labor',ed.pk));
      else await must(sb.from('labores').insert({labor:nombre}));
    }else{
      const row={nombre};
      for(const [id,,campo,tipo] of Lc.extra){row[campo]=tipo==='num'?numv(id,1):tipo==='bool'?val(id)==='Sí':(val(id)||null)}
      if(k==='destinos'&&!row.tipo) row.tipo='Otro';
      if(ed) await must(sb.from(Lc.tabla).update(row).eq(Lc.pk,ed.pk));
      else{
        const gen=nextIdGen(Lc.pref,items.map(i=>i.pk));const id=gen().replace(/-0+(\d{2,})$/,'-$1');
        await must(sb.from(Lc.tabla).insert({...row,[Lc.pk]:id,activo:true}));
      }
    }
    S.lEdit=null;S.lErr='';S.lConf=false;toast(`${Lc.t}: “${nombre}” guardado`);
    await (k==='choferes'?load():k==='estanques'?Promise.all([load(),loadMod('combustible')]):loadMod('combustible'));
  }catch(e){S.lErr=errMsg(e);render()}
}
async function accionLista(accion){
  const k=S.cb.lista, Lc=LISTAS[k], ed=Lc.items().find(i=>String(i.pk)===String(S.lEdit));
  if(!ed) return;
  try{
    if(accion==='activo') await must(sb.from(Lc.tabla).update({activo:!ed.activo}).eq(Lc.pk,ed.pk));
    else{
      if(Lc.uso(ed.pk)>0){S.lConf=false;S.lErr=`“${ed.nombre}” tiene ${Lc.uso(ed.pk)} usos registrados, así que no se puede eliminar. Desactívalo para que no aparezca en las listas.`;render();return}
      await must(sb.from(Lc.tabla).delete().eq(Lc.pk,ed.pk));
    }
    S.lEdit=null;S.lConf=false;S.lErr='';toast(accion==='activo'?(ed.activo?'Desactivado':'Activado'):'Eliminado');
    await (k==='choferes'?load():loadMod('combustible'));
  }catch(e){S.lErr=e.code==='23503'?'Tiene registros asociados: desactívalo en vez de eliminarlo.':errMsg(e);S.lConf=false;render()}
}

    const x=g.get(k)||{key:k,fecha:r.fecha,centro:r.centro,lote:r.lote,counts:{},obs:new Set()};

  }
  return [...g.values()];
}

/* ================= Leche ================= */
/* Litros totales del día = planta (estanque) + descarte + terneros + personal. */
const L_PARTES=['l_planta','l_descarte','l_terneros','l_personal'];
const lTot=r=>L_PARTES.every(k=>r[k]==null)?null:L_PARTES.reduce((a,k)=>a+(+r[k]||0),0);
function byDay(rows){
  const m=new Map();
  for(const r of rows){
    const g=m.get(r.fecha)||{fecha:r.fecha,vo:0,lt:0,conc:0,hasL:false};
    g.vo+=+r.vo||0;const t=lTot(r);if(t!=null){g.lt+=t;g.hasL=true}g.conc+=+r.conc_kg||0;m.set(r.fecha,g);
  }
  return [...m.values()];
}
/* Valor mensual de una métrica para un grupo de registros (una sala, un mes). */
function metricaMes(rows,met){
  let lt=0,dl=0,vo=0,dv=0,cc=0,dc=0,lv=0,vv=0,gl=0,gc=0;
  for(const r of rows){
    const t=lTot(r),v=r.vo==null?null:+r.vo,c=r.conc_kg==null?null:+r.conc_kg;
    if(t!=null){lt+=t;dl++}
    if(v!=null&&v>0){vo+=v;dv++;if(t!=null){lv+=t;vv+=v}}
    if(c!=null){cc+=c;dc++;if(t>0){gc+=c;gl+=t}}
  }
  return met==='litros'?(dl?lt/dl:null):met==='vo'?(dv?vo/dv:null):met==='lvo'?(vv?lv/vv:null):met==='conc'?(dc?cc/dc:null):(gl?gc*1000/gl:null);
}
function lecheKpis(rows){
  const d=byDay(rows);if(!d.length) return null;
  const withL=d.filter(x=>x.hasL);
  return {vacas:mean(d.map(x=>x.vo)),prod:mean(withL.map(x=>x.lt)),lvaca:mean(withL.filter(x=>x.vo>0).map(x=>x.lt/x.vo)),

/* Concentrado por sala en el período: consumo, eficiencia, ingresos a bodega y stock al cierre. */
function concPanel(win){
  const rows=SALAS.map(s=>{
    const rs=win.filter(r=>r.sala===s).sort((a,b)=>a.fecha.localeCompare(b.fecha));
    if(!rs.length) return null;
    const conDia=rs.filter(r=>r.conc_kg!=null);
    const vo=rs.filter(r=>r.conc_kg!=null&&+r.vo>0);
    const stock=[...rs].reverse().find(r=>r.conc_stock_kg!=null);
    return {s,dia:conDia.length?sum(conDia,'conc_kg')/conDia.length:null,
      kgvo:vo.length?sum(vo,'conc_kg')/sum(vo,'vo'):null,grl:metricaMes(rs,'grl'),
      ing:sum(rs,'conc_ingreso_kg'),merma:sum(rs,'conc_merma_kg'),stock};
  }).filter(Boolean);
  if(!rows.some(r=>r.dia!=null)) return '';
  return `<div class="panel"><h3>Concentrado por sala en el período</h3><div class="tablewrap"><table>
    <thead><tr><th>Sala</th><th class="num">kg por día</th><th class="num">kg por vaca</th><th class="num">g por litro</th><th class="num">Ingresos a bodega (kg)</th><th class="num">Merma (kg)</th><th class="num">Stock al cierre (kg)</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><span class="sq" style="background:${salaColor(r.s)}"></span> ${esc(r.s)}</td><td class="num">${fmt0(r.dia)}</td><td class="num">${fmt1(r.kgvo)}</td><td class="num">${fmt0(r.grl)}</td>
      <td class="num">${r.ing?fmt0(r.ing):'—'}</td><td class="num">${r.merma?fmt0(r.merma):'—'}</td>
      <td class="num">${r.stock?`<span class="${+r.stock.conc_stock_kg<0?'bad':''}" title="al ${esc(r.stock.fecha)}">${fmt0(r.stock.conc_stock_kg)}</span>`:'—'}</td></tr>`).join('')}
    </tbody></table></div><p class="note">Stock negativo = la planilla registró más consumo que ingresos a la bodega de esa sala; conviene revisar los ingresos.</p></div>`;
}
/* Calidad de leche (MG, proteína, sólidos, RCS, UFC, urea): solo si el período trae esos datos. */
function calidadPanel(win){

function lineChart(el,months,series,sel,M={u:'L',dec:0}){
  const fv=v=>M.dec?fmt1(v):fmt0(v);
  const W=Math.max(300,el.clientWidth),H=280,m={l:52,r:16,t:10,b:28};
  const iw=W-m.l-m.r,ih=H-m.t-m.b,n=months.length;
  const vals=series.flatMap(s=>s.pts).filter(v=>v!=null);
  if(!vals.length){el.innerHTML='<div class="empty">No hay datos de este indicador en el período.</div>';return}
  const step=niceStep(Math.max(...vals)/4),top=Math.ceil(Math.max(...vals)/step)*step||step;
  const x=i=>m.l+(n<=1?iw/2:i*iw/(n-1)),y=v=>m.t+ih-(v/top)*ih;
  let g='';
  for(let v=0;v<=top+1e-9;v+=step) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(${v===0?'--line-strong':'--grid'})" stroke-width="1"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${nf.format(v)}</text>`;
  const every=Math.max(1,Math.ceil(n/Math.max(1,Math.floor(iw/62))));
  months.forEach((mo,i)=>{if(i%every===0||i===n-1&&n-1-((n-1)-(n-1)%every)>=every/2) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${MES[+mo.slice(5,7)-1]} ${mo.slice(2,4)}</text>`});
  const path=pts=>{let d='',pen=false;pts.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);pen=true});return d};
  const ordered=[...series].sort((a,b)=>(a.sala===sel)-(b.sala===sel));
  for(const s of ordered){
    const on=sel==='Todos'||sel===s.sala;
    g+=`<path d="${path(s.pts)}" fill="none" style="stroke:${on?salaColor(s.sala):'var(--line-strong)'}" stroke-width="${on?2:1.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
    /* puntos sueltos (un mes sin vecinos) */
    s.pts.forEach((v,i)=>{if(v!=null&&s.pts[i-1]==null&&s.pts[i+1]==null) g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" style="fill:${on?salaColor(s.sala):'var(--line-strong)'}"/>`});
  }
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(M.t||'Gráfico por mes y sala')}">${g}<g id="lc-hover"></g><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="lc-hit"/></svg><div class="tip" id="lc-tip" hidden></div>`;
  const hit=el.querySelector('#lc-hit'),hov=el.querySelector('#lc-hover'),tip=el.querySelector('#lc-tip');
  const show=ev=>{
    const r=el.getBoundingClientRect(),mx=ev.clientX-r.left;
    const i=Math.max(0,Math.min(n-1,Math.round(n<=1?0:(mx-m.l)/(iw/(n-1)))));
    const vis=series.filter(s=>s.pts[i]!=null&&(sel==='Todos'||s.sala===sel)).sort((a,b)=>b.pts[i]-a.pts[i]);
    hov.innerHTML=`<line x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${m.t+ih}" style="stroke:var(--line-strong)" stroke-width="1"/>`+
      vis.map(s=>`<circle cx="${x(i)}" cy="${y(s.pts[i])}" r="4.5" style="fill:${salaColor(s.sala)};stroke:var(--surface)" stroke-width="2"/>`).join('');
    tip.innerHTML=`<b>${fmtYm(months[i])}</b>`+(vis.length?vis.map(s=>`<div><i class="sw" style="background:${salaColor(s.sala)}"></i>${esc(s.sala)}<span class="v">${fv(s.pts[i])} ${M.u}</span></div>`).join(''):'<div class="muted">Sin datos este mes</div>');
    tip.hidden=false;
    const tw=tip.offsetWidth,left=x(i)+14+tw>W?x(i)-14-tw:x(i)+14;
    tip.style.left=Math.max(0,left)+'px';tip.style.top=(m.t+4)+'px';
  };
  hit.addEventListener('pointermove',show);hit.addEventListener('pointerdown',show);
  hit.addEventListener('pointerleave',()=>{hov.innerHTML='';tip.hidden=true});
}

const val=id=>{const el=document.getElementById(id);if(!el)return null;const v=el.value.trim();return v===''?null:v};
const numv=(id,dec=0)=>{const v=val(id);if(v==null)return null;const n=+v.replace(',','.');if(isNaN(n))return null;const f=10**dec;return Math.round(n*f)/f};
async function saveEquipo(){
  if(S.saving) return;
  const isNew=S.open==='__new';
  const id=((isNew?val('e-id'):S.open)||'').toUpperCase();
  if(!RE_EQ.test(id)){S.formErr='El ID debe ser el prefijo del tipo, un guion y un número de dos cifras o más, por ejemplo TR-30 o CA-X06.';renderDrawer();return}
  if(isNew&&S.eq.has(id)){S.formErr=`Ya existe un equipo con el ID ${id}.`;renderDrawer();return}
  if(!val('e-nombre')){S.formErr='El equipo necesita un nombre.';renderDrawer();return}
  const anio=numv('e-anio');
  if(anio!=null&&(anio<1950||anio>2100)){S.formErr='El año debe estar entre 1950 y 2100.';renderDrawer();return}
  const iv=numv('e-iv');
  if(iv!=null&&iv<=0){S.formErr='El intervalo de mantención debe ser mayor que cero.';renderDrawer();return}
  const e={...eqRow(S.eq.get(id)||{}),id_maquina:id,n_interno:numv('e-num'),nombre:val('e-nombre'),tipo:val('e-tipo'),estado:val('e-estado'),marca:val('e-marca'),modelo:val('e-modelo'),
    anio,color:val('e-color'),patente:val('e-patente'),propietario:val('e-prop'),n_motor:val('e-motor'),n_serie:val('e-serie'),
    centro:val('e-centro'),operador_asignado:val('e-op'),uso_principal:val('e-uso'),intervalo_mant_horas:iv,horometro_inicial:numv('e-h0',1),
    unidad_medidor:val('e-unidad')||'horas',empresa_costo:(val('e-emp')||'').toUpperCase()||null};
  const docs=[];
  for(const [k,name] of DOCS){
    let sit=val(`d-${k}-sit`)||'Sin dato'; const v=val(`d-${k}-v`);
    if(v&&sit!=='Con fecha') sit='Con fecha';
    if(sit==='Con fecha'&&!v){S.formErr=`Indica el mes de vencimiento de ${name.toLowerCase()} o cambia su situación.`;renderDrawer();return}
    const old=S.docs.get(id+'__'+k);
    const d={id_maquina:id,documento:name,situacion:sit,vencimiento:sit==='Con fecha'?v:null,texto_original:old?old.texto_original:null};
    if(!old||old.situacion!==d.situacion||(old.vencimiento||null)!==d.vencimiento) docs.push(docRow(d));
  }
  S.formErr='';S.saving=true;renderDrawer();
  try{
    await upsert('equipos',[e],'id_maquina');
    await upsert('documentos',docs,'id_maquina,documento');
    S.saving=false;S.open=null;S.confirmDel=false;toast(`Ficha de ${id} guardada`);await load();
  }catch(err){S.saving=false;S.formErr=errMsg(err);renderDrawer()}
}
async function deleteEquipo(){
  const id=S.open;
  S.saving=true;renderDrawer();
  try{
    const [c,m]=await Promise.all([
      sb.from('combustible').select('id_carga',{count:'exact',head:true}).eq('id_maquina',id),
      sb.from('mantenciones').select('id_intervencion',{count:'exact',head:true}).eq('id_maquina',id)]);
    if(c.error) throw c.error; if(m.error) throw m.error;
    if((c.count||0)+(m.count||0)>0){S.saving=false;S.confirmDel=false;S.formErr=`${id} tiene cargas de combustible o mantenciones registradas, así que no se puede eliminar. Cambia su estado a “Baja” o “Vendida”.`;renderDrawer();return}
    await must(sb.from('documentos').delete().eq('id_maquina',id));
    await must(sb.from('equipos').delete().eq('id_maquina',id));
    if(S.imgs.has(id)){await sb.storage.from('equipos').remove([S.imgs.get(id).path]);S.imgs.delete(id)}
    S.saving=false;S.open=null;S.confirmDel=false;toast(`${id} eliminado`);await load();
  }catch(err){S.saving=false;S.formErr=errMsg(err);renderDrawer()}
}

      const t=val('r-tipo')||'Compra', id_silo=val('r-silo'), silo=S.sil.find(s=>s.id_silo===id_silo), compra=t==='Compra';
      const pres=compra?val('r-pres'):null, conEnvase=compra&&!!document.getElementById('r-env');
      const envases=conEnvase?numv('r-env',2):null, tamano_envase=conEnvase?numv('r-tam',2):null;
      return {fecha:val('r-fecha'),tipo:t,id_silo,id_insumo:silo?silo.id_insumo:val('r-ins'),presentacion:pres,envases,tamano_envase,
        cantidad:conEnvase?(envases>0&&tamano_envase>0?Math.round(envases*tamano_envase*10)/10:null):numv('r-cant',1),
        costo_total:compra?numv('r-costo'):null,proveedor:compra?val('r-prov'):null,documento:compra?val('r-doc'):null,observacion:val('r-obs')};
    },
    check(r){
      if(!r.fecha) return 'Indica la fecha.';
      if(!r.id_insumo) return 'Elige el insumo.';
      if(r.envases!==null||r.tamano_envase!==null) {if(!(r.envases>0)||!(r.tamano_envase>0)) return 'Indica los envases y el contenido de cada uno.'}
      if(r.cantidad==null) return 'Indica la cantidad.';
      if((r.tipo==='Compra'||r.tipo==='Salida')&&!(r.cantidad>0)) return 'La cantidad debe ser mayor que cero.';
      if(r.tipo==='Medición'&&r.cantidad<0) return 'La medición no puede ser negativa.';
      if(r.tipo==='Ajuste'&&r.cantidad===0) return 'El ajuste no puede ser cero.';
      if(r.costo_total!=null&&r.costo_total<0) return 'El costo no puede ser negativo.';
    },
    warn(r,n,key){
      if(r.id_silo&&r.tipo!=='Medición'){
        const s=S.sil.find(x=>x.id_silo===r.id_silo);
        if(!s||s.fecha_base==null) return `${silNombre(r.id_silo)} aún no tiene medición, así que este movimiento no cambia su nivel hasta registrar una medición con fecha anterior. Pulsa “Guardar igual” para seguir.`;
        if(r.fecha<=s.fecha_base) return `La última medición de ${s.nombre} es del ${s.fecha_base}: un movimiento de esa fecha o anterior ya está incluido en ella y no cambia el nivel. Pulsa “Guardar igual” para seguir.`;
      }
      if(r.tipo==='Salida'&&n){const s=stockLugar(r);if(s!=null&&r.cantidad>s) return `La salida es mayor que el stock registrado (${fmtN(s)} ${insUnidad(r.id_insumo)}). Revisa la cantidad o pulsa “Guardar igual”.`}
      return '';
    },
    async save(r,n,key){if(n) await must(sb.from('inv_movimientos').insert(r)); else await must(sb.from('inv_movimientos').update(r).eq('id_mov',key))},
    async del(key){await must(sb.from('inv_movimientos').delete().eq('id_mov',key))},
    done:'Movimiento guardado',after:['inventario','base']
  },
  comb:{
    title:(r,n)=>n?'Nueva carga de combustible':'Carga '+r.id_carga,
    sub:(r,n)=>n?'Combustible':r.fecha,
    body(r,n){
      const dt=r.dtipo||(r.id_destino?'destino':r.id_estanque_destino?'traspaso':'equipo');
      const lr=dt==='equipo'&&r.id_maquina?lastReading(r.id_maquina,r.fecha,n?null:r.id_carga):null;
      const ests=S.estq.filter(e=>e.activo||e.id_estanque===r.id_estanque||e.id_estanque===r.id_estanque_destino);
      const orig=r.id_estanque===undefined?(ests[0]?.id_estanque||''):(r.id_estanque||'');
      const pv=orig?precioVigente(r.fecha):null, stock=orig?stockAl(orig,r.fecha,n?null:r.id_carga):null;
      const u=r.id_maquina?uCorta(r.id_maquina):'h';
      return `<fieldset><legend>Carga</legend>
        ${fld('r-fecha','Fecha',r.fecha,{type:'date'})}
        ${fld('r-litros','Litros',r.litros,{type:'number'})}
        ${fld('r-dtipo','Destino',null,{list:opt([['equipo','Equipo'],['destino','Otro destino (bidón, servicio externo…)'],['traspaso','Traspaso a otro estanque']],dt,false),wide:true})}
        ${dt==='equipo'?fld('r-eq','Equipo',null,{list:opt(eqList(r.id_maquina),r.id_maquina),wide:true})
          :dt==='destino'?fld('r-des','Otro destino',null,{list:opt(S.dest.filter(d=>d.activo||d.id_destino===r.id_destino).map(d=>[d.id_destino,d.nombre+' · '+d.tipo]),r.id_destino),wide:true})
          :fld('r-estd','Estanque que recibe',null,{list:opt(ests.filter(e=>e.id_estanque!==orig).map(e=>[e.id_estanque,e.nombre]),r.id_estanque_destino),wide:true})}
        ${fld('r-orig','Sale de',null,{list:opt([...ests.map(e=>[e.id_estanque,e.nombre]),...(dt==='traspaso'?[]:[['','Estación de servicio (fuera del fundo)']])],orig,false)})}
        ${fld('r-op','Chofer',null,{list:opt(opList(r.id_operador),r.id_operador)})}
        ${!S.ops.size?'<p class="err" style="grid-column:1/-1;margin:0">Aún no hay choferes. Agrégalos en Combustible › Listas.</p>':''}
        ${dt==='equipo'?`${fld('r-horo',r.id_maquina?lecturaLbl(r.id_maquina):'Horómetro u odómetro',r.horometro,{type:'number'})}
          ${fld('r-lleno','Estanque del equipo lleno',null,{list:opt(['Sí','No'],r.estanque_lleno===false?'No':'Sí',false)})}`:''}
        ${fld('r-lab','Labor (opcional)',null,{list:opt(S.labs.filter(l=>l.activo||l.labor===r.labor).map(l=>l.labor),r.labor)})}
        ${orig?'':fld('r-precio','Precio por litro (CLP)',r.precio_litro,{type:'number'})}
        <div class="calc">
          ${dt==='equipo'?(r.id_maquina?(lr?`<span>Última lectura de ${esc(r.id_maquina)} <b>${fmtN(lr.h)} ${u}</b> ${lr.f?'el '+esc(lr.f):''}</span>`:`<span>${esc(r.id_maquina)} aún no tiene lecturas.</span>`):'<span>Elige el equipo para ver su última lectura.</span>'):''}
          ${orig?`<span>Stock de ${esc(estNombre(orig))} al ${esc(r.fecha||'día')} <b class="${stock<0?'bad':''}">${fmt0(stock)} L</b></span><span>Precio <b>${pv?clp(pv.precio_litro)+'/L':'sin compras con precio'}</b>${pv?` <span class="muted">(compra del ${esc(pv.fecha)})</span>`:''}</span>`:''}
        </div>
      </fieldset>
      <fieldset><legend>Otros datos</legend>
        ${dt==='equipo'?fld('r-centro','Centro (solo si trabajó fuera de su centro)',null,{list:opt(CENTROS,r.centro),wide:true}):''}
        ${fld('r-obs','Observación',r.observacion,{wide:true})}
      </fieldset>
      ${dt==='equipo'?'<p class="note" style="margin:0">Marca “lleno” cuando se llena completo: el rendimiento (L/h o km/L) se calcula entre dos cargas llenas. Las camionetas y camiones registran kilómetros; tractores y maquinaria, horas (se cambia en la ficha del equipo).</p>':''}`;
    },
    read(){
      const dt=val('r-dtipo')||'equipo', orig=document.getElementById('r-orig')?(val('r-orig')||null):undefined, fecha=val('r-fecha');
      const r={dtipo:dt,fecha,litros:numv('r-litros',1),id_operador:val('r-op'),labor:val('r-lab'),observacion:val('r-obs'),
        id_maquina:dt==='equipo'?val('r-eq'):null,id_destino:dt==='destino'?val('r-des'):null,id_estanque_destino:dt==='traspaso'?val('r-estd'):null,
        id_estanque:orig,horometro:dt==='equipo'?numv('r-horo',1):null,estanque_lleno:dt==='equipo'?val('r-lleno')!=='No':false,centro:dt==='equipo'?val('r-centro'):null};
      r.origen=orig?'Estanque fundo':'Estación de servicio';
      r.precio_litro=orig?(precioVigente(fecha)?.precio_litro??null):numv('r-precio',2);
      return r;
    },
    check(r){
      if(!r.fecha) return 'Indica la fecha de la carga.';
      if(!(r.litros>0)) return 'Los litros deben ser mayores que cero.';
      if(r.dtipo==='equipo'&&!r.id_maquina) return 'Elige el equipo.';
      if(r.dtipo==='destino'&&!r.id_destino) return 'Elige el destino.';
      if(r.dtipo==='traspaso'&&(!r.id_estanque||!r.id_estanque_destino)) return 'Un traspaso necesita el estanque que entrega y el que recibe.';
      if(!r.id_operador) return S.ops.size?'Elige el chofer.':'Primero agrega choferes en Combustible › Listas.';
      if(r.dtipo==='equipo'&&r.horometro==null&&usaHoras(r.id_maquina)) return `Indica el ${unidadDe(r.id_maquina)==='km'?'odómetro (km)':'horómetro'}: con él se calcula el rendimiento y la próxima mantención.`;
      if(r.precio_litro!=null&&r.precio_litro<0) return 'El precio no puede ser negativo.';
    },
    warn(r,n,key){
      if(r.id_estanque){const s=stockAl(r.id_estanque,r.fecha,n?null:key);if(r.litros>s) return `${estNombre(r.id_estanque)} quedaría con stock negativo: al ${r.fecha} tenía ${fmt0(s)} L registrados. Revisa los litros o registra el ingreso que falta, o pulsa “Guardar igual”.`}
      return r.dtipo==='equipo'?horoWarn(r,n?null:key):'';

    async save(r,n,key){

    },
    async del(key){await must(sb.from('combustible').delete().eq('id_carga',key))},
    done:'Carga guardada',after:['combustible','mantenciones','base']
  },

        ${fld('r-tipo','Tipo',null,{list:opt([['Compra','Compra (reposición)'],['Saldo inicial','Saldo inicial'],['Ajuste','Ajuste (positivo o negativo)']],t,false)})}
        ${fld('r-litros','Litros',r.litros,{type:'number'})}
        ${fld('r-precio','Precio por litro (CLP)',r.precio_litro,{type:'number'})}
        ${fld('r-prov','Proveedor',r.proveedor)}
        ${fld('r-doc','Guía o factura',r.documento)}
        ${fld('r-obs','Observación',r.observacion,{wide:true})}

    },
    warn:r=>r.tipo==='Compra'&&r.precio_litro==null?'La compra no tiene precio: los despachos seguirán valorizados con el precio de la compra anterior. Pulsa “Guardar igual” si no lo tienes.':'',
    async save(r,n,key){if(n) await must(sb.from('combustible_ingresos').insert(r)); else await must(sb.from('combustible_ingresos').update(r).eq('id_ingreso',key))},
    async del(key){await must(sb.from('combustible_ingresos').delete().eq('id_ingreso',key))},
    done:'Ingreso guardado',after:['combustible','base']
  },

  reb:{

        ${fld('r-lote','Lote',r.lote,{ro:!n,ph:'L1'})}

        ${fld('r-obs','Observación',r.obs,{wide:true,ph:'Revisión veterinario'})}

      if(n&&S.reb.some(x=>x.fecha===r.fecha&&x.centro===r.centro&&x.lote===r.lote)) return 'Ya hay un conteo para ese día, centro y lote. Ábrelo desde Historial para corregirlo.';
    },
    warn:()=>'',

    done:'Conteo guardado',after:['rebano']
  },

const TIPOS_DOC=['Factura electrónica','Factura exenta electrónica','Nota de crédito electrónica','Boleta electrónica','Otro'];
const docCorto=f=>(f.tipo_documento==='Factura electrónica'?'Factura':f.tipo_documento==='Factura exenta electrónica'?'Factura exenta':f.tipo_documento==='Nota de crédito electrónica'?'Nota de crédito':f.tipo_documento||'')+(f.folio?' N° '+f.folio:'');
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
/* Texto del PDF reconstruido en líneas (de arriba hacia abajo, de izquierda a derecha). */
async function pdfLineas(file){
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const lineas=[];
  for(let p=1;p<=Math.min(pdf.numPages,4);p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    const filas=[];
    for(const it of tc.items){
      if(!it.str||!it.str.trim()) continue;
      const x=it.transform[4],y=it.transform[5];
      let f=filas.find(f=>Math.abs(f.y-y)<3);
      if(!f){f={y,items:[]};filas.push(f)}
      f.items.push({x,s:it.str.trim()});
    }
    filas.sort((a,b)=>b.y-a.y);
    for(const f of filas) lineas.push(f.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join('  '));
  }
  return lineas;
}
const sinTilde=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const MESES_ES={ENERO:1,FEBRERO:2,MARZO:3,ABRIL:4,MAYO:5,JUNIO:6,JULIO:7,AGOSTO:8,SEPTIEMBRE:9,SETIEMBRE:9,OCTUBRE:10,NOVIEMBRE:11,DICIEMBRE:12};
function fechaDe(s){
  const u=sinTilde(s);let m;
  if((m=u.match(/(\d{1,2})\s+DE\s+([A-Z]+)\s+(?:DE|DEL)\s+(\d{4})/))&&MESES_ES[m[2]]) return `${m[3]}-${String(MESES_ES[m[2]]).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if((m=u.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})\b/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if((m=u.match(/\b(\d{4})-(\d{2})-(\d{2})\b/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
/* Último monto de una línea, en formato chileno (1.234.567 o 1234567). */
function montoDe(s){const ms=[...s.replace(/\$\s*/g,'$').matchAll(/(\d{1,3}(?:\.\d{3})+|\d+)(?:,\d+)?/g)];if(!ms.length)return null;const v=+ms[ms.length-1][1].replace(/\./g,'');return isNaN(v)?null:v}
const RE_RUT=/(\d{1,2}\.?\d{3}\.?\d{3}\s*-\s*[\dkK])/;
/* Reglas para la factura electrónica del SII: recuadro con RUT, tipo y folio; fecha de emisión; detalle; totales. */
function leerFactura(lineas){
  const U=lineas.map(sinTilde), r={};
  const iTipo=U.findIndex(l=>/(FACTURA|NOTA DE CREDITO|BOLETA)/.test(l)&&/ELECTRONICA/.test(l));
  const tipoTxt=iTipo>=0?U[iTipo]:U.find(l=>/FACTURA|BOLETA|NOTA DE CREDITO/.test(l))||'';
  r.tipo_documento=/NOTA DE CREDITO/.test(tipoTxt)?'Nota de crédito electrónica':/EXENTA/.test(tipoTxt)?'Factura exenta electrónica':/BOLETA/.test(tipoTxt)?'Boleta electrónica':/FACTURA/.test(tipoTxt)?'Factura electrónica':'Otro';
  /* folio: "N° 12345" cerca del tipo de documento */
  const zona=iTipo>=0?U.slice(Math.max(0,iTipo-2),iTipo+4):U.slice(0,15);
  for(const l of zona){const m=l.match(/(?:\bN\s*[O°º.]*|FOLIO|NUMERO)\s*:?\s*(\d{1,10})\b/);if(m){r.folio=m[1];break}}
  /* RUT del emisor: el del recuadro (junto al tipo de documento) o el primero del documento */
  for(const l of zona){const m=l.match(RE_RUT);if(m){r.rut_proveedor=m[1].replace(/\s/g,'').toUpperCase();break}}
  if(!r.rut_proveedor){const l=U.find(l=>RE_RUT.test(l));if(l)r.rut_proveedor=l.match(RE_RUT)[1].replace(/\s/g,'').toUpperCase()}
  /* razón social: primera línea con texto que no sea parte del recuadro ni un dato */
  const prov=lineas.find((l,i)=>/[A-Za-zÁÉÍÓÚÑ]{3}/.test(l)&&!/R\.?\s*U\.?\s*T|RUT|FACTURA|ELECTRONICA|S\.?I\.?I|GIRO|DIRECCION|FONO|EMAIL|E-MAIL|WWW|CASA MATRIZ|SUCURSAL|BOLETA|NOTA DE/.test(U[i]));
  if(prov) r.proveedor=prov.replace(/\s{2,}.*/,'').trim();
  /* fecha de emisión */
  const iF=U.findIndex(l=>/FECHA\s*(DE\s*)?EMISION/.test(l));
  r.fecha=(iF>=0&&(fechaDe(lineas[iF])||fechaDe(lineas[iF+1]||'')))||lineas.map(fechaDe).find(Boolean)||null;
  /* montos: último número de la línea con la etiqueta (o de la siguiente) */
  const monto=re=>{for(let i=U.length-1;i>=0;i--){if(re.test(U[i])){const v=montoDe(U[i].replace(re,' '));if(v!=null)return v;const w=montoDe(U[i+1]||'');if(w!=null)return w}}return null};
  r.monto_neto=monto(/MONTO\s+NETO|\bNETO\b/);
  r.monto_exento=monto(/MONTO\s+EXENTO|^\s*EXENTO\b/);
  r.iva=monto(/\bI\.?\s*V\.?\s*A\b\.?\s*(\(?\s*19\s*%\s*\)?)?/);
  r.monto_total=monto(/^\s*(MONTO\s+)?TOTAL\b|\bTOTAL\s*\$|\bMONTO\s+TOTAL\b/);
  if(r.monto_total==null&&r.monto_neto!=null) r.monto_total=(r.monto_neto||0)+(r.iva||0)+(r.monto_exento||0);
  if(r.monto_neto==null&&r.monto_total!=null&&r.iva!=null) r.monto_neto=r.monto_total-r.iva-(r.monto_exento||0);
  /* detalle: líneas entre el encabezado de la tabla de ítems y los totales, sin las cifras */
  const iIni=U.findIndex(l=>/DESCRIPCION|DETALLE|\bITEM\b|CODIGO/.test(l));
  /* fin del detalle: totales, referencias, timbre o el monto en palabras ("SON SEISCIENTOS…") */
  let iFin=U.findIndex((l,i)=>i>iIni&&/MONTO\s+NETO|\bNETO\b|SUBTOTAL|REFERENCIA|TIMBRE|FORMA DE PAGO|^\s*SON\b|OBSERVACION/.test(l));
  if(iIni>=0){
    if(iFin<0) iFin=Math.min(U.length,iIni+12);
    const det=lineas.slice(iIni+1,iFin).map(l=>l.split(/\s{2,}/).filter(p=>/[A-Za-zÁÉÍÓÚÑ]{3}/.test(p)&&!/^\$/.test(p)).join(' ').replace(/(\s+[\d.,]+)+$/,'').trim()).filter(Boolean);
    /* sin repetidos: muchos PDF repiten la descripción en una segunda línea */
    r.detalle=[...new Map(det.map(d=>[sinTilde(d),d])).values()].join('; ').slice(0,500)||null;
  }
  return r;
}
function cuadreFactura(r){
  const n=r.monto_neto||0,e=r.monto_exento||0,i=r.iva||0,t=r.monto_total;
  if(t==null) return {ok:false,txt:'Falta el total'};
  const okSuma=Math.abs(n+e+i-t)<=2, okIva=!n||Math.abs(Math.round(n*0.19)-i)<=2;
  return {ok:okSuma&&okIva,txt:okSuma&&okIva?'Neto + IVA + exento = total ✓':!okSuma?`Neto + IVA + exento (${clp(n+e+i)}) no da el total (${clp(t)})`:`El IVA (${clp(i)}) no es el 19 % del neto (${clp(Math.round(n*0.19))})`};
}
async function cargarPdf(file){
  if(!S.rec||S.rec.kind!=='fact') return;
  const d=S.rec.data;
  if(file.type&&file.type!=='application/pdf'){S.formErr='El archivo debe ser un PDF.';renderDrawer();return}
  if(file.size>10*1024*1024){S.formErr='El PDF pesa más de 10 MB.';renderDrawer();return}
  S.rec.file=file;d.nombre_archivo=file.name;S.formErr='';S.rec.msg='Leyendo el PDF…';renderDrawer();
  try{
    if(!window.pdfjsLib) throw new Error('lector');
    const lineas=await pdfLineas(file);S.rec.lineas=lineas;
    if(lineas.join('').replace(/\s/g,'').length<40){S.rec.msg='El PDF no trae texto (parece escaneado o una foto). Completa los datos a mano.';renderDrawer();return}
    const r=leerFactura(lineas);
    for(const [k,v] of Object.entries(r)) if(v!=null&&v!=='') d[k]=v;
    const enc=['fecha','proveedor','folio','monto_total'].filter(k=>d[k]!=null).length;
    S.rec.msg=enc===4?'Datos leídos del PDF. Revísalos antes de guardar.':'Leí parte de los datos; completa lo que falte.';
  }catch(e){S.rec.msg='No pude leer el PDF. Completa los datos a mano.'}
  renderDrawer();
}

const key=h=>String(h).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const clean=v=>{if(v==null)return null;if(v instanceof Date)return v;const t=String(v).trim();return t===''?null:(typeof v==='number'?v:t)};
const ym=v=>{if(v instanceof Date)return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}`;if(typeof v==='string'){const m=v.match(/^(\d{4})-(\d{2})/);if(m)return m[1]+'-'+m[2]}return null};
const yes=v=>v==null?true:!/^(no|n|false|0)$/i.test(String(v).trim());
/* Fecha desde Excel: número de serie, texto AAAA-MM-DD o DD-MM-AAAA. */
function toISO(v){
  if(v==null||v==='') return null;
  if(v instanceof Date&&!isNaN(v)) return isoLocal(v);
  if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:null}
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
/* Número desde Excel: si el texto trae coma decimal (1.234,5) se quitan los puntos de miles. */
const nm=v=>{if(v==null||v==='')return null;if(typeof v==='number')return v;const s=String(v).trim();const n=+(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s);return isNaN(n)?null:n};
const SALA_NORM={'PICHIJUAN':'PICHI JUAN','PICHI JUAN':'PICHI JUAN','MELIES':'LOS MELIES','LOS MELIES':'LOS MELIES','S JORGE':'S JORGE','SAN JORGE':'S JORGE','S SEBAST':'S SEBAST','S SEBAST.':'S SEBAST','SAN SEBASTIAN':'S SEBAST','S SEBASTIAN':'S SEBAST','COPIHUE':'COPIHUE'};
const normSala=s=>s==null?null:(SALA_NORM[String(s).trim().toUpperCase().replace(/\s+/g,' ')]||String(s).trim().toUpperCase());
const LECHE_COLS={fecha:'fecha',date:'fecha',sala:'sala',centro:'sala',vacas:'vo',vacas_ordena:'vo',vacas_en_ordena:'vo',l_estanque:'l_planta',litros_planta:'l_planta',estanque:'l_planta',descarte:'l_descarte',terneros:'l_terneros',personal:'l_personal',conc:'conc_kg',concentrado:'conc_kg',kg_conc:'conc_kg',
  ...Object.fromEntries([...LECHE_NUM,...LECHE_TXT].map(k=>[k,k]))};
function sheetRows(wb,names,fallbackFirst){
  let s=wb.SheetNames.find(x=>names.includes(key(x)));
  if(!s&&fallbackFirst) s=wb.SheetNames.find(x=>/leche|normal|datos/i.test(x))||wb.SheetNames[0];

  return XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:null,raw:true}).map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[key(k),clean(v)])));

function nextIdGen(prefix,ids){let n=0;for(const id of ids){const m=String(id).match(new RegExp('^'+prefix+'-(\\d+)$'));if(m)n=Math.max(n,+m[1])}return()=>prefix+'-'+String(++n).padStart(4,'0')}
const dedupe=(rows,k)=>[...new Map(rows.map(r=>[k(r),r])).values()];
async function importReg(kind,file){

    src.forEach((r,i)=>{
      const f=`Fila ${i+2}`, id=r.id_carga?String(r.id_carga).trim().toUpperCase():null;

      if(!fecha) return issues.push(`${f}: fecha no válida.`);
      if(!S.eq.has(eq)) return issues.push(`${f}: el equipo ${eq||'(vacío)'} no existe.`);
      if(!S.ops.has(op)) return issues.push(`${f}: el operador ${op||'(vacío)'} no existe.`);
      if(!(litros>0)) return issues.push(`${f}: litros no válidos.`);

    src.forEach((r,i)=>{

      if(!['Preventiva','Correctiva'].includes(r.tipo)) return issues.push(`${f}: tipo debe ser Preventiva o Correctiva.`);
      if(r.tipo==='Preventiva'&&horo==null) return issues.push(`${f}: preventiva sin horómetro.`);
      if(r.sistema&&!SISTEMAS.includes(r.sistema)) return issues.push(`${f}: sistema “${r.sistema}” no reconocido.`);
      if(r.tipo_taller&&!['Interno','Externo'].includes(r.tipo_taller)) return issues.push(`${f}: taller debe ser Interno o Externo.`);
      rows.push({id_intervencion:id||gen(),fecha,id_maquina:eq,tipo:r.tipo,sistema:r.sistema||null,descripcion:r.descripcion==null?null:String(r.descripcion),horometro:horo,costo_repuestos:Math.round(nm(r.costo_repuestos)||0),costo_mano_obra:Math.round(nm(r.costo_mano_obra)||0),proveedor:r.proveedor==null?null:String(r.proveedor),tipo_taller:r.tipo_taller||null,dias_fuera_servicio:nm(r.dias_fuera_servicio)});
    });
    table='mantenciones';conflict='id_intervencion';rows=dedupe(rows,r=>r.id_intervencion);
  }else if(kind==='rebano'){
    const src=sheetRows(wb,['conteos','rebano']);
    if(!src){toast('No encontré la hoja “Conteos” en el archivo.');return}
    src.forEach((r,i)=>{
      const f=`Fila ${i+2}`;
      if(!r.fecha&&!r.centro&&r.cantidad==null) return;
      const fecha=toISO(r.fecha), cant=nm(r.cantidad), lote=r.lote==null?null:String(r.lote).trim().toUpperCase();
      if(!fecha) return issues.push(`${f}: fecha no válida.`);

      if(!lote) return issues.push(`${f}: falta el lote.`);

      if(cant==null||cant<0||!Number.isInteger(cant)) return issues.push(`${f}: cantidad no válida.`);
      rows.push({fecha,centro:r.centro,lote,estado:r.estado,cantidad:cant,observacion:r.observacion==null?null:String(r.observacion)});
    });
    table='rebano';conflict='fecha,centro,lote,estado';rows=dedupe(rows,r=>[r.fecha,r.centro,r.lote,r.estado].join('|'));
  }else if(kind==='leche'){
    const src=sheetRows(wb,['leche_diaria','leche_normalizada','leche','por_sala'],true);
    src.forEach((r0,i)=>{

      const o={fecha,sala};
      for(const k of LECHE_NUM){let v=nm(r[k]);if(v!=null&&LECHE_INT.includes(k))v=Math.round(v);o[k]=v}
      for(const k of LECHE_TXT) o[k]=r[k]==null?null:String(r[k]);

  await afterWrite(kind==='combustible'||kind==='mantenciones'?['combustible','mantenciones','base']:kind==='leche'?['leche','rebano']:['rebano']);
}
/* Importación de la planilla de petróleo del fundo (hoja "Base Datos"): reposiciones → ingresos al estanque,
   despachos → cargas (a equipo, otro destino o traspaso a estanque), saldo inicial desde la columna EXISTENCIA.
   Se reconoce por nombre: equipos (nombre de la ficha), otros destinos, estanques y choferes de las Listas.
   Cada fila lleva una clave (ref_externa), así que reimportar la misma planilla actualiza en vez de duplicar. */
const ALIAS_EQUIPO={'CHRISTIAN LANDMANN (1)':'CA-01'};   // dos camionetas comparten el nombre; la de la planilla es la F-150
async function importarBasePetroleo(wb){
  const src=sheetRows(wb,['base_datos']);
  const N=s=>sinTilde(String(s??'')).replace(/\s+/g,' ').trim();
  const eqBy=new Map();for(const e of S.eq.values()){const k=N(e.nombre);eqBy.set(k,eqBy.has(k)?null:e.id_maquina)}
  const desBy=new Map(S.dest.map(d=>[N(d.nombre),d.id_destino])), estBy=new Map(S.estq.map(e=>[N(e.nombre),e.id_estanque]));
  const opBy=new Map([...S.ops.values()].map(o=>[N(o.nombre),o.id_operador])), labBy=new Map(S.labs.map(l=>[N(l.labor),l.labor]));
  const issues=[], ings=[], cargas=[], vistos=new Map();
  const ref=p=>{const k=p.join('|'),n=(vistos.get(k)||0)+1;vistos.set(k,n);return 'BDP:'+k+'#'+n};
  const filas=src.map((r,i)=>({r,i,f:`Fila ${i+2}`,fecha:toISO(r.fecha),est:estBy.get(N(r.estanque_de_despacho))}));
  /* saldo inicial: la primera fila con existencia (la planilla lleva la existencia del estanque principal) */
  const p0=filas.find(x=>nm(x.r.existencia_petroleo_litros)!=null&&x.fecha&&x.est);
  if(p0){const s=nm(p0.r.existencia_petroleo_litros)+(nm(p0.r.litros_despachados_petroleo)||0)-(nm(p0.r.reposicion_litros)||0);
    if(s>0) ings.push({fecha:p0.fecha,id_estanque:p0.est,tipo:'Saldo inicial',litros:s,precio_litro:null,proveedor:null,documento:null,observacion:'Calculado desde la columna EXISTENCIA de la planilla',ref_externa:'BDP:saldo-inicial:'+p0.est})}
  for(const x of filas){
    const rep=nm(x.r.reposicion_litros);
    if(!(rep>0)) continue;
    if(!x.fecha){issues.push(`${x.f}: reposición sin fecha válida.`);continue}
    if(!x.est){issues.push(`${x.f}: estanque “${x.r.estanque_de_despacho??''}” no está en la lista de estanques.`);continue}
    const pr=nm(x.r.precio_petroleo);
    ings.push({fecha:x.fecha,id_estanque:x.est,tipo:'Compra',litros:rep,precio_litro:pr>0?Math.round(pr*100)/100:null,proveedor:null,documento:null,observacion:null,ref_externa:ref(['ING',x.fecha,x.est,rep])});
  }
  const compras=ings.filter(i=>i.tipo==='Compra'&&i.precio_litro!=null).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const precioAl=f=>{let p=null;for(const c of compras){if(c.fecha<=f)p=c.precio_litro;else break}return p??compras[0]?.precio_litro??null};
  for(const x of filas){
    const lit=nm(x.r.litros_despachados_petroleo);
    if(!(lit>0)) continue;
    if(!x.fecha){issues.push(`${x.f}: despacho sin fecha válida.`);continue}
    if(!x.est){issues.push(`${x.f}: estanque “${x.r.estanque_de_despacho??''}” no está en la lista de estanques.`);continue}
    const nom=N(x.r.maquinaria), d={id_maquina:null,id_destino:null,id_estanque_destino:null};
    if(estBy.has(nom)) d.id_estanque_destino=estBy.get(nom);
    else if(ALIAS_EQUIPO[nom]) d.id_maquina=ALIAS_EQUIPO[nom];
    else if(eqBy.get(nom)) d.id_maquina=eqBy.get(nom);
    else if(desBy.has(nom)) d.id_destino=desBy.get(nom);
    else if(!nom&&desBy.has('SIN IDENTIFICAR')) d.id_destino=desBy.get('SIN IDENTIFICAR');
    else {issues.push(`${x.f}: “${x.r.maquinaria??''}” no es un equipo, otro destino ni estanque de las listas.`);continue}
    if(d.id_estanque_destino===x.est){issues.push(`${x.f}: traspaso al mismo estanque.`);continue}
    const ch=N(x.r.chofer), op=opBy.get(ch)||null;
    if(ch&&!op&&ch!=='OPERADOR') issues.push(`${x.f}: chofer “${x.r.chofer}” no está en la lista; se importa sin chofer.`);
    const lab=x.r.labor?labBy.get(N(x.r.labor))||null:null;
    if(x.r.labor&&!lab) issues.push(`${x.f}: labor “${x.r.labor}” no está en la lista; se importa sin labor.`);
    const h=nm(x.r.horometro);
    cargas.push({fecha:x.fecha,...d,id_estanque:x.est,origen:'Estanque fundo',id_operador:op,litros:lit,
      horometro:d.id_maquina&&h>0?h:null,estanque_lleno:!!d.id_maquina,precio_litro:precioAl(x.fecha),labor:lab,centro:null,
      empresa_costo:x.r.propietario&&!d.id_estanque_destino?String(x.r.propietario).trim().toUpperCase():null,observacion:x.r.observacion==null?null:String(x.r.observacion),
      ref_externa:ref(['CAR',x.fecha,nom,lit,x.r.horometro??'',ch,x.est])});
  }
  /* IDs: se conservan los de filas ya importadas (misma clave); las nuevas siguen la numeración */
  const cByRef=new Map(S.comb.filter(c=>c.ref_externa).map(c=>[c.ref_externa,c.id_carga])), genC=nextIdGen('CAR',S.comb.map(c=>c.id_carga));
  for(const c of cargas) c.id_carga=cByRef.get(c.ref_externa)||genC();
  const iByRef=new Map(S.ing.filter(i=>i.ref_externa).map(i=>[i.ref_externa,i.id_ingreso])), genI=nextIdGen('ING',S.ing.map(i=>i.id_ingreso));
  for(const i of ings) i.id_ingreso=iByRef.get(i.ref_externa)||genI();
  S.importKind='combustible';S.importIssues=issues;
  if(!cargas.length&&!ings.length){render();toast('No encontré despachos ni reposiciones válidas en la hoja “Base Datos”.');return}
  toast(`Importando ${fmt0(cargas.length)} despachos y ${fmt0(ings.length)} ingresos…`);
  try{await upsert('combustible_ingresos',ings,'id_ingreso');await upsert('combustible',cargas,'id_carga')}
  catch(e){toast(errMsg(e));await loadMod('combustible');return}
  toast(`${fmt0(cargas.length)} despachos y ${fmt0(ings.length)} ingresos importados${issues.length?` · ${issues.length} avisos`:''}`);
  await afterWrite(['combustible','mantenciones','base']);
}
/* Importación de la plantilla de maquinaria (equipos, documentos, operadores). */
async function importXls(file){
  if(typeof XLSX==='undefined'){toast('No se pudo cargar el lector de Excel. Recarga la página.');return}
  let wb;try{wb=XLSX.read(await file.arrayBuffer(),{cellDates:true})}catch(e){toast('El archivo no se pudo leer como Excel.');return}
  const sheet=n=>sheetRows(wb,[n])||[];
  const issues=[];
  const ops=[],opIds=new Set(S.ops.keys());
  sheet('operadores').forEach((r,i)=>{
    const id=r.id_operador&&String(r.id_operador).trim().toUpperCase();
    if(!id) return;
    if(!RE_OP.test(id)){issues.push(`Operadores fila ${i+2}: ID “${id}” no tiene el formato OP-01.`);return}
    if(!r.nombre){issues.push(`Operadores fila ${i+2}: ${id} sin nombre.`);return}
    if(r.centro&&!CENTROS.includes(String(r.centro))){issues.push(`Operadores fila ${i+2}: centro “${r.centro}” no existe.`);return}
    ops.push({id_operador:id,nombre:String(r.nombre),centro:r.centro?String(r.centro):null,activo:yes(r.activo)});opIds.add(id);
  });
  const eqs=[],eqIds=new Set(S.eq.keys());let nE=0,uE=0;
  sheet('equipos').forEach((r,i)=>{
    const id=r.id_maquina&&String(r.id_maquina).trim().toUpperCase();
    if(!id) return;
    const f=`Equipos fila ${i+2} (${id})`;
    if(!RE_EQ.test(id)){issues.push(`${f}: el ID no tiene el formato TR-30.`);return}
    const prev=S.eq.get(id);
    const e={...eqRow(prev||{}),id_maquina:id};
    for(const c of EQ_COLS.slice(1)) if(r[c]!=null) e[c]=EQ_NUM.includes(c)?(isNaN(+r[c])?null:(c==='horometro_inicial'?Math.round(+r[c]*10)/10:Math.round(+r[c]))):String(r[c]);
    if(!e.nombre){issues.push(`${f}: falta el nombre.`);return}
    if(!TIPOS.includes(e.tipo)){issues.push(`${f}: tipo “${e.tipo??''}” no existe.`);return}
    if(e.estado==null) e.estado='Activa';
    if(!ESTADOS.includes(e.estado)){issues.push(`${f}: estado “${e.estado}” no existe.`);return}
    if(e.centro&&!CENTROS.includes(e.centro)){issues.push(`${f}: centro “${e.centro}” no existe.`);return}
    if(e.operador_asignado&&!opIds.has(e.operador_asignado)){issues.push(`${f}: el operador ${e.operador_asignado} no existe en Operadores.`);return}
    prev?uE++:nE++;eqs.push(e);eqIds.add(id);
  });
  const docs=[];
  sheet('documentos').forEach((r,i)=>{
    const id=r.id_maquina&&String(r.id_maquina).trim().toUpperCase(); const dk=DOCS.find(([,n])=>key(n)===key(r.documento||''));
    if(!id) return;
    if(!dk){issues.push(`Documentos fila ${i+2}: documento “${r.documento??''}” no reconocido.`);return}
    if(!eqIds.has(id)){issues.push(`Documentos fila ${i+2}: el equipo ${id} no existe.`);return}
    const v=ym(r.vencimiento);
    const sit=SITS.includes(r.situacion)?r.situacion:(v?'Con fecha':'Sin dato');
    if(sit==='Con fecha'&&!v){issues.push(`Documentos fila ${i+2} (${id}): “Con fecha” sin mes de vencimiento.`);return}
    docs.push(docRow({id_maquina:id,documento:dk[1],situacion:sit,vencimiento:sit==='Con fecha'?v:null,texto_original:r.texto_original==null?null:String(r.texto_original)}));
  });
  S.importKind='maquinaria';S.importIssues=issues;
  if(!ops.length&&!eqs.length&&!docs.length){render();toast('No encontré hojas Equipos, Documentos u Operadores con datos válidos.');return}
  toast('Importando…');
  try{
    await upsert('operadores',ops,'id_operador');
    await upsert('equipos',eqs,'id_maquina');
    await upsert('documentos',docs,'id_maquina,documento');
  }catch(err){toast(errMsg(err));await load();return}
  toast(`${nE} equipos nuevos · ${uE} actualizados · ${docs.length} documentos · ${ops.length} operadores${issues.length?` · ${issues.length} filas omitidas`:''}`);
  await load();
}

/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-mod],[data-tab],[data-tipo],[data-docf],[data-act],[data-open],[data-op],[data-rec],button[data-set]'); if(!t)return;
  if(t.dataset.mod){S.mod=t.dataset.mod;S.open=null;S.rec=null;S.formErr='';render();return}
  if(t.dataset.set&&t.tagName==='BUTTON'){const [o,k]=t.dataset.set.split('.');S[o][k]=t.dataset.val;render();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;S.formErr='';render();return}
  if(t.dataset.tipo){S.tipo=t.dataset.tipo;render();return}
  if(t.dataset.docf){S.docf=t.dataset.docf;render();return}
  if(t.dataset.open){S.rec=null;S.open=t.dataset.open;S.formErr='';S.confirmDel=false;renderDrawer();return}
  if(t.dataset.rec){openRec(t.dataset.rec,t.dataset.key);return}
  if(t.dataset.op){S.opEdit=S.ops.get(t.dataset.op)||null;S.formErr='';render();return}
  const a=t.dataset.act;
  if(a==='close'){if(S.saving)return;if(S.rec){closeRec();return}S.open=null;S.formErr='';S.confirmDel=false;renderDrawer()}
  else if(a==='new'){S.open='__new';S.formErr='';renderDrawer()}
  else if(a==='save'){ev.preventDefault();saveEquipo()}
  else if(a==='rec-new'){newRec(t.dataset.kind,{...(t.dataset.mtipo&&{tipo:t.dataset.mtipo}),...(t.dataset.silo&&{id_silo:t.dataset.silo})})}
  else if(a==='rec-save'){ev.preventDefault();saveRec()}
  else if(a==='del'){S.confirmDel=true;renderDrawer()}
  else if(a==='del-no'){S.confirmDel=false;renderDrawer()}
  else if(a==='del-yes'){deleteEquipo()}
  else if(a==='rec-del-yes'){deleteRec()}
  else if(a==='import'){S.importKind=t.dataset.kind;$('#xls').click()}
  else if(a==='img-lote'){S.imgFor=null;$('#imgs').multiple=true;$('#imgs').click()}
  else if(a==='img-una'){S.imgFor=t.dataset.val;$('#imgs').multiple=false;$('#imgs').click()}
  else if(a==='img-quitar'){S.imgConf=t.dataset.val;renderDrawer()}
  else if(a==='img-quitar-no'){S.imgConf=null;renderDrawer()}
  else if(a==='img-quitar-si'){quitarImagen(t.dataset.val)}
  else if(a==='op-cancel'){S.opEdit=null;S.formErr='';render()}
  else if(a==='reload'){S.loadErr='';render();load()}
  else if(a==='reload-mod'){S.mods[t.dataset.kind].err='';loadMod(t.dataset.kind)}
  else if(a==='issues-close'){S.importIssues=[];render()}
  else if(a==='logout'){logout()}
  else if(a==='fact-pdf'){ev.preventDefault();ev.stopPropagation();verPdf(t.dataset.path)}
  else if(a==='est-sel'){S.cb.est=t.dataset.val;render()}
  else if(a==='lista'){S.cb.lista=t.dataset.val;S.lEdit=null;S.lConf=false;S.lErr='';render()}
  else if(a==='lista-edit'){S.lEdit=t.dataset.val;S.lConf=false;S.lErr='';render();const el=$('#l-nombre');if(el)el.focus()}
  else if(a==='lista-cancel'){S.lEdit=null;S.lConf=false;S.lErr='';render()}
  else if(a==='lista-activo'){accionLista('activo')}
  else if(a==='lista-del'){S.lConf=true;render()}
  else if(a==='lista-del-si'){accionLista('borrar')}
  else if(a==='lc-preset'){
    const ms=[...new Set(S.leche.map(r=>r.fecha.slice(0,7)))].sort(),v=t.dataset.val;
    if(v==='all'){S.lc.from=ms[0];S.lc.to=ms[ms.length-1]}
    else if(v==='12'){S.lc.to=ms[ms.length-1];S.lc.from=ms[Math.max(0,ms.length-12)]}
    else{const y=ms.filter(m=>m.startsWith(v));S.lc.from=y[0];S.lc.to=y[y.length-1]}
    render();
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&(S.open||S.rec)&&!S.saving){if(S.rec)closeRec();else{S.open=null;S.confirmDel=false;renderDrawer()}return}
  if(ev.key==='Enter'){const r=ev.target.closest('tr[data-open],tr[data-op],tr[data-rec]');if(r){r.click()}}
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.id==='f-centro'){S.centro=el.value;render();return}
  if(el.id==='xls'){const f=el.files[0];if(f){if(S.importKind==='maquinaria')importXls(f);else importReg(S.importKind,f)}el.value='';return}
  if(el.id==='imgs'){const fs=[...el.files];if(fs.length)subirImagenes(fs,S.imgFor);el.value='';return}
  if(el.dataset.set){const [o,k]=el.dataset.set.split('.');S[o][k]=el.value;if(o==='lc'&&k==='from'&&S.lc.to<el.value)S.lc.to=el.value;if(o==='lc'&&k==='to'&&S.lc.from>el.value)S.lc.from=el.value;render();return}
  /* al cambiar el equipo o la fecha de un registro, se actualiza la última lectura de horómetro */
  if(S.rec&&(el.id==='r-eq'||el.id==='r-fecha')&&(S.rec.kind==='comb'||S.rec.kind==='mant')){S.rec.data={...S.rec.data,...REC[S.rec.kind].read()};S.warn='';S.warnAck=false;renderDrawer()}
  /* carga: al cambiar destino u origen cambia el formulario; ingreso y medición recalculan totales y diferencias */
  if(S.rec&&((S.rec.kind==='comb'&&['r-dtipo','r-orig'].includes(el.id))||(S.rec.kind==='ing'&&['r-litros','r-precio'].includes(el.id))||(S.rec.kind==='med'&&['r-est','r-fecha','r-med'].includes(el.id)))){
    S.rec.data={...S.rec.data,...REC[S.rec.kind].read()};S.warn='';S.warnAck=false;renderDrawer();
  }
  /* inventario: el tipo, el lugar y la presentación cambian el formulario; envases y costo recalculan la cantidad y el costo por unidad */
  if(S.rec&&S.rec.kind==='mov'&&['r-tipo','r-silo','r-ins','r-pres','r-env','r-tam','r-costo'].includes(el.id)){
    S.rec.data={...S.rec.data,...REC.mov.read(),...(['r-silo','r-ins'].includes(el.id)&&{presentacion:null})};S.warn='';S.warnAck=false;renderDrawer();
  }
  /* facturas: al elegir el PDF se lee; al cambiar equipo, vínculo o montos se actualiza el formulario */
  if(S.rec&&S.rec.kind==='fact'){
    if(el.id==='r-pdf'){const f=el.files[0];if(f){S.rec.data={...S.rec.data,...REC.fact.read()};cargarPdf(f)}return}
    if(['r-eq','r-vinc','r-mtipo','r-neto','r-exento','r-iva','r-total'].includes(el.id)){S.rec.data={...S.rec.data,...REC.fact.read()};S.warn='';S.warnAck=false;renderDrawer()}
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='f-q'){S.q=ev.target.value;const pos=ev.target.selectionStart;renderEquipos([...S.eq.values()],false);const el=$('#f-q');el.focus();el.setSelectionRange(pos,pos)}
  else if(S.rec&&S.warnAck&&ev.target.closest('#recform')){S.warnAck=false}
});
document.addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(ev.target.id==='loginform'){login();return}
  if(ev.target.id==='eqform'){saveEquipo();return}
  if(ev.target.id==='recform'){saveRec();return}
  if(ev.target.id==='listaform'){guardarLista();return}
  if(ev.target.classList.contains('nivelform')){guardarNivel(ev.target);return}
  if(ev.target.id!=='opform'||S.saving)return;
  const id=(val('op-id')||'').toUpperCase(),nombre=val('op-nombre');
  if(!RE_OP.test(id)){S.formErr='Escribe un ID con el formato OP-01.';render();return}
  if(!nombre){S.formErr='Escribe el nombre del operador.';render();return}
  if(!S.opEdit&&S.ops.has(id)){S.formErr=`Ya existe el operador ${id}.`;render();return}
  S.saving=true;
  try{await upsert('operadores',[opRow({id_operador:id,nombre,centro:val('op-centro'),activo:val('op-activo')||'Sí'})],'id_operador');S.opEdit=null;S.formErr='';toast(`Operador ${id} guardado`);S.saving=false;await load()}
  catch(err){S.saving=false;S.formErr=errMsg(err);render()}
});
/* Al volver a la pestaña, trae los cambios que hayan hecho otras personas. */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!S.user||S.open||S.rec) return;
  if(Date.now()-S.loadedAt>30000) load();
  const m=S.mods[S.mod];if(m&&m.loaded&&Date.now()-(m.at||0)>30000) loadMod(S.mod);
});

if(!sb){
  document.body.innerHTML='<div class="ph" style="padding:0 16px"><h2>No se pudo cargar Torre de Control Agrícola</h2><p>Falta la conexión con el servidor. Revisa internet y recarga la página.</p></div>';
}else{
  sb.auth.onAuthStateChange((event,session)=>{
    const u=session?session.user:null;
    const changed=(u&&u.id)!==(S.user&&S.user.id);
    S.user=u;S.authReady=true;
    if(changed){clearData();if(u)setTimeout(load,0)}
    showAuth();
  });
}
